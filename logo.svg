<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="ice" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="iceLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="300" fill="url(#bg)" rx="16"/>

  <!-- Geometric Abstract Ice Blocks -->
  <path d="M 100 300 L 250 120 L 400 300 Z" fill="url(#ice)" opacity="0.3" filter="url(#glow)"/>
  <path d="M 300 300 L 450 80 L 600 300 Z" fill="url(#ice)" opacity="0.4" filter="url(#glow)"/>
  <path d="M 550 300 L 700 150 L 850 300 Z" fill="url(#ice)" opacity="0.2" filter="url(#glow)"/>
  <path d="M -50 300 L 150 50 L 350 300 Z" fill="url(#ice)" opacity="0.2"/>

  <!-- Jumping Character -->
  <g transform="translate(460, 40)" filter="url(#glow)">
    <!-- Motion trails -->
    <rect x="-18" y="25" width="12" height="12" fill="#38bdf8" opacity="0.4" transform="rotate(15)"/>
    <rect x="-35" y="45" width="10" height="10" fill="#38bdf8" opacity="0.2" transform="rotate(30)"/>
    <!-- Character Body -->
    <rect x="0" y="0" width="26" height="26" rx="6" fill="#ef4444"/>
    <rect x="2" y="26" width="22" height="22" rx="4" fill="#3b82f6"/>
    <!-- Eye -->
    <circle cx="18" cy="8" r="4" fill="#ffffff"/>
    <circle cx="19" cy="8" r="1.5" fill="#000000"/>
    <path d="M 14 16 L 22 16" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Base Platform -->
  <path d="M 0 280 L 800 280 L 800 300 L 0 300 Z" fill="url(#iceLight)"/>
  <path d="M 0 285 L 800 285" stroke="#ffffff" stroke-width="2" opacity="0.5"/>

  <!-- Title Text -->
  <text x="400" y="180" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="100" fill="url(#textGrad)" text-anchor="middle" filter="url(#glow)" style="letter-spacing: 8px;">
    ICY TOWER
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="230" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="24" fill="#7dd3fc" text-anchor="middle" style="letter-spacing: 4px;">
    WEB EDITION
  </text>
  
  <!-- Snow particles -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="150" cy="50" r="2.5"/><circle cx="280" cy="90" r="3.5"/><circle cx="650" cy="40" r="1.5"/>
    <circle cx="720" cy="120" r="3"/><circle cx="80" cy="160" r="2"/><circle cx="600" cy="180" r="3"/>
    <circle cx="220" cy="220" r="2"/><circle cx="750" cy="250" r="2.5"/>
  </g>
</svg>
